services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroorder_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-1029}:80"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=agroorder_db
      - DB_USERNAME=demo_app_db
      - DB_PASSWORD=demopass123
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - agro_network

  db:
    image: mysql:8.0
    container_name: agroorder_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: demopass123
      MYSQL_DATABASE: agroorder_db
      MYSQL_USER: demo_app_db
      MYSQL_PASSWORD: demopass123
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pdemopass123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - agro_network

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  agro_network:
    driver: bridge
